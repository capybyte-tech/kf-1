    :root {
      --white: #f4f2ee;
      --white-soft: rgba(244, 242, 238, 0.86);
      --black: #050505;
      --line: rgba(244, 242, 238, 0.82);
      --gutter: clamp(20px, 5vw, 76px);
      --title-size: clamp(56px, 6.5vw, 130px);
      --tagline-size: calc(var(--title-size) * 0.35);
      --lockup-w: calc(var(--title-size) * 3.52);
      --intro-scale: 1.45;
      --t: 1.2s;
      --ease: cubic-bezier(.65, 0, .35, 1);
      --ease-out: cubic-bezier(.2, .7, .2, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overscroll-behavior: none; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    .hero__media {
      position: absolute;
      inset: 0;
      z-index: -2;
      transform-origin: 60% 30%;
      will-change: transform;
      transition: transform var(--t) var(--ease);
      animation: mediaIn .45s var(--ease-out) backwards;
    }
    .hero__layer {
      position: absolute;
      inset: 0;
      background-repeat: no-repeat;
      background-size: auto 118%;
      background-position: 77% 46%;
    }

    .hero__glow-wrap {
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
      will-change: opacity;
      transition: opacity var(--t) var(--ease);
      animation: mediaIn .9s .5s var(--ease-out) backwards;
    }
    .hero__glow {
      background-image: url('assets/img/kaizen-bg.webp');
      filter: brightness(1.2) contrast(2.6);
      will-change: opacity;
      animation: glowBreath 6.5s ease-in-out infinite alternate;
    }
    .hero__shade {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 90% at 62% 42%, rgba(0,0,0,.3) 20%, rgba(0,0,0,.78) 100%);
      opacity: 0;
      will-change: opacity;
      transition: opacity var(--t) var(--ease);
    }

    @media (min-aspect-ratio: 21/10) {
      .hero__layer { background-size: cover; background-position: 85% 30%; }
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:

        radial-gradient(ellipse 22% 42% at 88% 50%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.38) 45%, rgba(0,0,0,0) 100%),
        linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 28%, rgba(0,0,0,.08) 55%, rgba(0,0,0,0) 70%),
        linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,.45) 100%);
      pointer-events: none;
    }

    .nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(18px, 3.4vh, 34px) var(--gutter) 0;
      z-index: 10;
    }
    .nav > nav, .burger {
      transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: clamp(8px, 0.75vw, 12px);
      line-height: 1;
      font-family: 'Jost', sans-serif;
      text-transform: uppercase;
    }
    .logo__mark {
      display: block;
      height: clamp(44px, 4.4vw, 64px);
      width: auto;
      margin: -4px 0 -4px -6px;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,.45));
    }
    .logo__kanji {
      display: flex;
      flex-direction: column;
      font-family: 'Noto Serif JP', serif;
      font-weight: 400;
      font-size: clamp(16px, 1.55vw, 23px);
      line-height: 1.12;
      text-transform: none;
    }
    .nav__links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.6vw, 40px);
      list-style: none;
      font-size: clamp(11px, 0.98vw, 15px);
      font-weight: 500;
    }
    .nav__links a:not(.btn-reserve) {
      position: relative;
      opacity: .95;
      transition: opacity .25s;
    }
    .nav__links a:not(.btn-reserve)::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -6px;
      height: 1px;
      background: var(--white);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s ease;
    }
    .nav__links a:not(.btn-reserve):hover::after { transform: scaleX(1); }

    .btn-reserve {
      display: inline-block;
      background: var(--white);
      color: #111;
      padding: 0.78em 1.05em;
      border-radius: 4px;
      font-weight: 500;
      margin-left: clamp(0px, 0.4vw, 8px);
      transition: background .25s, transform .25s;
    }
    .btn-reserve:hover { background: #fff; transform: translateY(-1px); }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 0.45em;
      font-family: 'Jost', sans-serif;
      font-size: 0.92em;
      letter-spacing: 0.14em;
    }
    .lang-switch button {
      background: none;
      border: 0;
      padding: 0.3em 0.1em;
      color: var(--white);
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      opacity: .45;
      border-bottom: 1px solid transparent;
      transition: opacity .25s, border-color .25s;
    }
    .lang-switch button:hover { opacity: .85; }
    .lang-switch button.is-active { opacity: 1; border-bottom-color: var(--white); }
    .lang-switch button:focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }
    .lang-sep { opacity: .35; }

    .burger { display: none; background: none; border: 0; cursor: pointer; width: 30px; height: 20px; position: relative; }
    .burger span { position: absolute; left: 0; right: 0; height: 1.5px; background: var(--white); transition: .3s; }
    .burger span:nth-child(1) { top: 2px; }
    .burger span:nth-child(2) { top: 9px; }
    .burger span:nth-child(3) { top: 16px; }

    .hero__content {
      position: absolute;
      left: var(--gutter);
      top: 50%;
      translate: 0 -50%;
      max-width: none;
      transform-origin: 0 50%;
      transition: transform var(--t) var(--ease);
    }

    .lockup-wrap, .rest-wrap {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows var(--t) var(--ease), margin var(--t) var(--ease);
    }
    .lockup-wrap { margin: -10px 0 0 -6px; }
    .lockup, .rest { min-height: 0; overflow: hidden; }
    .lockup__in { padding: 10px 0 0 6px; }
    .lockup { transition: none; }

    .kanji {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: calc(var(--title-size) * 0.29);
      line-height: 1.16;
      display: flex;
      align-items: center;
      gap: 0.32em;
      margin-bottom: calc(var(--title-size) * 0.16);
      color: rgba(244, 242, 238, .78);
      animation: fadeUp .7s .1s var(--ease-out) backwards;
    }
    .kanji__chars { display: flex; flex-direction: column; }

    .kanji__mark {
      display: block;
      height: 2.55em;
      width: auto;
      margin: -0.12em 0 -0.12em -0.06em;
      opacity: .78;
    }

    .title {
      font-family: 'Oswald', 'Jost', sans-serif;
      font-weight: 400;
      font-size: var(--title-size);
      letter-spacing: 0.20em;
      line-height: 1;
      margin-right: -0.20em;
      margin-left: -0.055em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: fadeUp .7s .14s var(--ease-out) both;
    }
    .title__text, .tagline__text { display: inline-block; }

    .title-rule {
      display: block;
      width: clamp(26px, 2.9vw, 42px);
      height: 2px;
      background: var(--white);
      margin: clamp(14px, 2.6vh, 26px) 0 clamp(6px, 1.2vh, 12px);
      transform-origin: left;
      animation: grow .6s .3s var(--ease-out) both;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: var(--tagline-size);
      letter-spacing: 0.06em;
      line-height: 1.2;
      white-space: nowrap;
      animation: fadeUp .7s .26s var(--ease-out) both;
    }

    .lead {
      margin-top: clamp(12px, 2.4vh, 24px);
      font-size: clamp(12px, 1.12vw, 16.5px);
      line-height: 1.45;
      color: var(--white-soft);
      max-width: 23em;
      transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
    }

    .btn-start {
      margin-top: clamp(22px, 5vh, 46px);
      display: inline-flex;
      align-items: center;
      gap: 0.95em;
      border: 1.5px solid var(--line);
      padding: 0.72em 1.15em 0.72em 1.1em;
      font-size: clamp(13px, 1.22vw, 18px);
      font-weight: 500;
      border-radius: 1px;
      transition: opacity .8s var(--ease-out), transform .8s var(--ease-out), background .3s, color .3s;
    }
    .btn-start svg { width: 1.45em; height: auto; transition: transform .3s ease; }
    .btn-start:hover { background: var(--white); color: #111; }
    .btn-start:hover svg { transform: translateX(4px); }

    .pillars {
      position: absolute;
      right: var(--gutter);
      top: 27%;
      height: 46%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding-left: clamp(18px, 3.2vw, 42px);
      transition: opacity .8s var(--ease-out);
    }

    .pillars::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1.5px;
      background: var(--line);
      transform-origin: top;
      transition: transform .9s var(--ease-out);
    }
    .pillars::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 12px;
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
    }
    .pillars li {
      list-style: none;
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: clamp(10px, 1.03vw, 15px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #fff;
      text-shadow: 0 0 2px rgba(0,0,0,.55), 0 1px 10px rgba(0,0,0,.75), 0 0 24px rgba(0,0,0,.6);
      margin-right: -0.24em;
      cursor: default;
      transition: transform .35s ease, opacity .35s;
    }
    .pillars::before, .pillars::after { filter: drop-shadow(0 0 6px rgba(0,0,0,.7)); }
    .pillars:hover li { opacity: .5; }
    .pillars li:hover { opacity: 1; transform: translateX(-4px); }

    .scroll-cue {
      position: absolute;

      left: calc(var(--gutter) + var(--lockup-w) * var(--intro-scale) / 2);
      bottom: clamp(22px, 3.2vh, 36px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 1.6vh, 16px);
      padding: 8px 14px 0;
      background: none;
      border: 0;
      color: var(--white);
      cursor: pointer;
      z-index: 5;
      transition: opacity .6s ease, transform .9s var(--ease);
      animation: fadeIn .6s .55s ease backwards;
    }

    .scroll-cue__label {
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      font-size: clamp(9px, 0.62vw, 11.5px);
      letter-spacing: 0.46em;
      margin-right: -0.46em;
      text-transform: uppercase;
      opacity: .6;
      animation: cueBreath 2.8s ease-in-out infinite;
    }

    .scroll-cue__line {
      position: relative;
      display: block;
      width: 1px;
      height: clamp(46px, 7vh, 72px);
      background: rgba(244, 242, 238, .12);
      overflow: hidden;
    }
    .scroll-cue__line::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(244,242,238,.15), var(--white));
      transform-origin: top;
      animation: cueLine 2.8s var(--ease) infinite;
    }
    .scroll-cue:hover .scroll-cue__label { opacity: 1; animation-play-state: paused; }
    .scroll-cue:hover .scroll-cue__line::after { animation-duration: 1.6s; }
    .scroll-cue:focus-visible { outline: 1px solid rgba(244,242,238,.5); outline-offset: 6px; }

    .is-intro .hero__media { transform: scale(1.05); }
    .is-home .hero__blur { opacity: .85; }
    .is-home .hero__glow-wrap { opacity: 0; }
    .is-home .hero__shade { opacity: 1; }
    .is-intro .scroll-cue { transition-delay: .55s; }
    .is-intro .hero__content { transform: scale(var(--intro-scale)); }

    .is-intro .nav > nav,
    .is-intro .burger,
    .is-intro .lead,
    .is-intro .btn-start,
    .is-intro .pillars {
      opacity: 0;
      pointer-events: none;
      transition-duration: .4s;
      transition-delay: 0s;
    }
    .is-intro .nav > nav,
    .is-intro .burger    { transform: translateY(-14px); }
    .is-intro .logo { pointer-events: none; }
    .is-intro .logo__kanji, .is-intro .logo__mark { opacity: 0; }
    .is-intro .rest-wrap { grid-template-rows: 0fr; }

    .is-home .lockup-wrap { grid-template-rows: 0fr; margin-top: 0; }
    .is-home .lockup { opacity: 0; }
    .is-intro .lead      { transform: translateY(16px); }
    .is-intro .btn-start { transform: translateY(16px); }
    .is-intro .pillars::before { transform: scaleY(0); transition-duration: .4s; }

    .is-home .nav > nav,
    .is-home .burger { transition-delay: .5s, .5s; }

    .no-anim, .no-anim *, .no-anim *::before, .no-anim *::after { transition: none !important; }
    .is-home .lead      { transition-delay: .56s, .56s; }
    .is-home .btn-start { transition-delay: .64s, .64s, 0s, 0s; }
    .is-home .pillars   { transition-delay: .56s; }
    .is-home .pillars::before { transition-delay: .56s; }
    .is-home .pillars li { animation: fadeLeft .8s var(--ease-out) backwards; }
    .is-home .pillars li:nth-child(1) { animation-delay: .64s; }
    .is-home .pillars li:nth-child(2) { animation-delay: .70s; }
    .is-home .pillars li:nth-child(3) { animation-delay: .76s; }
    .is-home .pillars li:nth-child(4) { animation-delay: .82s; }

    .is-home .scroll-cue {
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition-duration: .45s;
    }

    @keyframes mediaIn  { from { opacity: 0; } }
    @keyframes focusIn  { from { opacity: 1; } }
    @keyframes glowBreath { from { opacity: .06; } to { opacity: .4; } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeLeft { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes grow     { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes cueLine  {
      0%        { transform: scaleY(0); transform-origin: top; }
      45%       { transform: scaleY(1); transform-origin: top; }
      45.01%    { transform: scaleY(1); transform-origin: bottom; }
      90%, 100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @keyframes cueBreath { 0%, 100% { opacity: .45; } 45% { opacity: .85; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media (max-width: 860px) {
      .nav__links li:not(:last-child):not(.lang-item) { display: none; }
    }

      .nav.open .nav__links { opacity: 1; pointer-events: auto; }
      .nav.open .burger span:nth-child(1) { top: 9px; transform: rotate(45deg); }
      .nav.open .burger span:nth-child(2) { opacity: 0; }
      .nav.open .burger span:nth-child(3) { top: 9px; transform: rotate(-45deg); }
      .burger { display: block; }
      .logo__mark { height: clamp(38px, 6vw, 56px); }

      .hero__content {
        top: auto;
        right: var(--gutter);
        bottom: calc(var(--pill-bottom) + clamp(62px, 9vh, 110px));

        max-width: none;
        transform-origin: 0 100%;
      }
      .hero__content { transition: transform var(--t) var(--ease), bottom var(--t) var(--ease); }
      .is-intro .hero__content { bottom: calc(var(--pill-bottom) + clamp(110px, 16vh, 150px)); }
      .title-rule { margin: 16px 0 10px; }
      .lead { font-size: clamp(14px, 2.2vw, 19px); line-height: 1.5; margin-top: clamp(14px, 2vh, 22px); max-width: 21em; }
      .btn-start { font-size: clamp(14px, 2.1vw, 18px); margin-top: clamp(22px, 3vh, 34px); }

      .pillars {
        top: auto;
        bottom: var(--pill-bottom);
        left: var(--gutter);
        right: var(--gutter);

        flex-direction: row;
        justify-content: space-between;
        padding: 13px 0 0;
      }
      .pillars::before {
        top: 0; bottom: auto; left: 0; right: 0;
        width: auto; height: 1px;
        transform-origin: left;
      }
      .pillars::after {
        top: 0; bottom: auto; left: 0; right: 0;
        width: auto; height: 7px;
        border: 0;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .pillars li {
        font-size: clamp(9px, 1.7vw, 14px);
        letter-spacing: 0.17em;
        margin-right: -0.17em;
        text-shadow: none;
      }
      .is-intro .pillars::before { transform: scaleX(0); }
      .is-home .pillars li { animation-name: fadeUp; }

      .scroll-cue { bottom: var(--pill-bottom); }
    }

    @media (max-width: 360px) {
      .pillars li { font-size: 8px; letter-spacing: 0.12em; margin-right: -0.12em; }
    }

    @media (max-height: 520px) and (orientation: landscape) and (min-width: 641px) {
      :root { --intro-scale: 1.1; --title-size: clamp(44px, 6.6vw, 72px); }
      .hero__content { top: auto; bottom: 9%; translate: none; transform-origin: 0 100%; }
      .hero__content { transition: transform var(--t) var(--ease), bottom var(--t) var(--ease); }
      .is-intro .hero__content { bottom: 96px; }
      .title-rule { margin: 10px 0 6px; }

      .btn-start { margin-top: 14px; font-size: 12px; }
      .pillars { top: 22%; height: 60%; }
      .scroll-cue__line { height: 34px; }
      .scroll-cue { bottom: 14px; gap: 10px; }
    }
</style>

  <script>    const I18N = {
      es: {
        title: 'Kaizen Fitness — Potencia tu performance',
        description: 'Entrenamiento personal y asesoramiento para una mejor versión de ti.',
        bgAlt: 'Atleta de espaldas, sudoroso, en blanco y negro',
        logoAlt: 'Kaizen Fitness — Inicio',
        navHome: 'Inicio', navServices: 'Servicios', navPlans: 'Planes', navAbout: 'Sobre mí',
        navBook: 'Reservar sesión',
        tagline: 'Potencia tu performance.',
        lead: 'Entrenamiento personal y asesoramiento para una mejor versión de ti.',
        cta: 'Empezar',
        pillarsAlt: 'Pilares',
        p1: 'Fuerza', p2: 'Movilidad', p3: 'Rendimiento', p4: 'Salud',
        scroll: 'Empezar', scrollAlt: 'Descubrir la página',
        menuOpen: 'Abrir menú', menuClose: 'Cerrar menú'
      },

      en: {
        title: 'Kaizen Fitness — Boost your performance',
        description: 'Personal training and coaching to help you become the best version of yourself.',
        bgAlt: 'Athlete seen from behind, sweating, in black and white',
        logoAlt: 'Kaizen Fitness — Home',
        navHome: 'Home', navServices: 'Services', navPlans: 'Plans', navAbout: 'About me',
        navBook: 'Book a session',
        tagline: 'Boost your performance.',
        lead: 'Personal training and coaching to help you become the best version of yourself.',
        cta: 'Get started',
        pillarsAlt: 'Pillars',
        p1: 'Strength', p2: 'Mobility', p3: 'Performance', p4: 'Health',
        scroll: 'Start', scrollAlt: 'Explore the page',
        menuOpen: 'Open menu', menuClose: 'Close menu'
      }
    };

    const LOCALE = { es: 'es-ES', en: 'en-GB' };
    const STORE_KEY = 'kaizen-lang';

    function storedLang() {
      try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
    }
    function saveLang(l) {
      try { localStorage.setItem(STORE_KEY, l); } catch (e) {}
    }
    function browserLang() {
      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages : [navigator.language || 'en'];
      for (const l of prefs) {
        const code = String(l).toLowerCase().slice(0, 2);
        if (code === 'es' || code === 'en') return code;
      }
      return 'en';
    }
    function initialLang() {
      const forced = new URLSearchParams(location.search).get('lang');
      if (I18N[forced]) return forced;
      const saved = storedLang();
      if (I18N[saved]) return saved;
      return browserLang();
    }

    const root = document.documentElement;
    const nav = document.querySelector('.nav');
    const burger = document.querySelector('.burger');
    let T;

    function applyLang(lang) {
      T = I18N[lang];
      root.lang = LOCALE[lang];
      document.title = T.title;
      document.querySelector('meta[name="description"]').setAttribute('content', T.description);
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', T[el.dataset.i18nAria]); });
      document.querySelectorAll('.lang-switch button').forEach(b => {
        const on = b.dataset.lang === lang;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', on);
      });
      burger.setAttribute('aria-label', nav.classList.contains('open') ? T.menuClose : T.menuOpen);
    }

    const titleText = document.querySelector('.title__text');
    const taglineText = document.querySelector('.tagline__text');
    const TITLE_TRACK = 0.20;
    const TITLE_BEARING = 0.055;
    const TAG_TRACK = -0.01;

    function fitTitle() {
      const fs = parseFloat(getComputedStyle(titleText).fontSize);
      const ink = titleText.offsetWidth - (TITLE_TRACK + TITLE_BEARING) * fs;
      const tagFs = parseFloat(getComputedStyle(taglineText).fontSize);
      const tagEm = taglineText.offsetWidth / tagFs - TAG_TRACK;
      if (!ink || !tagEm) return;
      root.style.setProperty('--tagline-size', (ink / tagEm).toFixed(2) + 'px');
      root.style.setProperty('--lockup-w', ink.toFixed(2) + 'px');
    }

    applyLang(initialLang());
    fitTitle();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
    let fitRaf;
    window.addEventListener('resize', () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitTitle); });

    document.querySelectorAll('.lang-switch button').forEach(b =>
      b.addEventListener('click', () => {
        saveLang(b.dataset.lang);
        applyLang(b.dataset.lang);
        fitTitle();
        if (location.search.includes('lang=')) history.replaceState(null, '', location.pathname + location.hash);
      }));

    burger.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      burger.setAttribute('aria-expanded', open);
      burger.setAttribute('aria-label', open ? T.menuClose : T.menuOpen);
    });
    document.querySelectorAll('.nav__links a').forEach(a =>
      a.addEventListener('click', () => nav.classList.remove('open')));

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const LOCK_MS = reduceMotion ? 250 : 1300;
    let state = root.classList.contains('is-home') ? 'home' : 'intro';
    let lockedUntil = (!reduceMotion && state === 'intro') ? Date.now() + 650 : 0;

    const lockup = document.querySelector('.lockup');
    const PAIRS = [
      { kind: 'chars', hero: document.querySelector('.kanji__chars'), logo: document.querySelector('.logo__kanji') },
      { kind: 'mark',  hero: document.querySelector('.kanji__mark'),  logo: document.querySelector('.logo__mark') }
    ];
    const HERO_OP = .78;
    const MORPH_MS = 1200;

    function applyClasses(st) {
      root.classList.toggle('is-intro', st === 'intro');
      root.classList.toggle('is-home', st === 'home');
    }

    const heroContent = document.querySelector('.hero__content');

    function measureAs(st, fn) {
      root.classList.add('no-anim');
      applyClasses(st);
      const out = fn();
      applyClasses(state);
      void document.body.offsetHeight;
      root.classList.remove('no-anim');
      return out;
    }

    const ink = a => `rgba(244, 242, 238, ${a})`;
    const q = v => Math.round(v * 64) / 64;
    const layoutH = el => parseFloat(getComputedStyle(el).height);
    const nativeSize = (p, el) => p.kind === 'chars' ? parseFloat(getComputedStyle(el).fontSize) : layoutH(el);
    const lerp = (a, b, t) => a + (b - a) * t;

    function bezier(x1, y1, x2, y2) {
      const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
      const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
      const X = t => ((ax * t + bx) * t + cx) * t;
      const Y = t => ((ay * t + by) * t + cy) * t;
      return x => {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        let lo = 0, hi = 1, t = x;
        for (let i = 0; i < 40; i++) {
          if (X(t) < x) lo = t; else hi = t;
          t = (lo + hi) / 2;
        }
        return Y(t);
      };
    }
    const EASE = bezier(.65, 0, .35, 1);

    function localPoses() {
      heroContent.style.transform = 'none';
      heroContent.style.translate = 'none';
      const c = heroContent.getBoundingClientRect();
      const out = PAIRS.map(p => {
        const r = p.hero.getBoundingClientRect();
        return { left: q(r.left - c.left), top: q(r.top - c.top), size: nativeSize(p, p.hero) };
      });
      heroContent.style.transform = '';
      heroContent.style.translate = '';
      return out;
    }

    function screenPose(p, el, r) {
      const k = r.height / layoutH(el);
      return { left: r.left, top: r.top, size: nativeSize(p, el) * k };
    }

    function makeClone(p, src, inHero) {
      const cs = getComputedStyle(src);
      const c = src.cloneNode(true);
      c.removeAttribute('class');
      c.classList.add('morph-clone');
      c.setAttribute('aria-hidden', 'true');
      Object.assign(c.style, {
        position: inHero ? 'absolute' : 'fixed', margin: '0', zIndex: '30', pointerEvents: 'none',
        visibility: 'hidden', transformOrigin: '0 0'
      });
      if (p.kind === 'chars') {
        Object.assign(c.style, {
          display: 'flex', flexDirection: 'column', fontFamily: cs.fontFamily, fontWeight: cs.fontWeight,
          lineHeight: String(parseFloat(cs.lineHeight) / parseFloat(cs.fontSize)), whiteSpace: 'nowrap'
        });
      } else {
        c.__base = layoutH(src);
        Object.assign(c.style, { display: 'block', width: 'auto', height: c.__base + 'px', filter: cs.filter });
      }
      (inHero ? heroContent : document.body).appendChild(c);
      return c;
    }

    function place(p, c, left, top, size, alpha) {
      c.style.left = left + 'px';
      c.style.top = top + 'px';
      c.style.color = ink(alpha);
      if (p.kind === 'chars') {
        c.style.fontSize = size + 'px';
      } else {
        const k = size / c.__base;
        c.style.transform = Math.abs(k - 1) < 1e-6 ? 'none' : `scale(${k})`;
        c.style.opacity = alpha;
      }
    }

    let flight = null;

    function endFlight() {
      if (!flight) return;
      cancelAnimationFrame(flight.raf);
      PAIRS.forEach(p => { p.logo.style.opacity = ''; });
      lockup.style.opacity = '';
      flight.items.forEach(it => { it.a.remove(); it.b.remove(); });
      flight = null;
    }

    function morph(next) {
      endFlight();
      const toHome = next === 'home';
      const logoRects = PAIRS.map(p => p.logo.getBoundingClientRect());
      const heroRects = toHome ? PAIRS.map(p => p.hero.getBoundingClientRect()) : null;
      const heroLocal = measureAs('intro', () => ({
        local: localPoses(),
        rects: toHome ? null : PAIRS.map(p => p.hero.getBoundingClientRect())
      }));

      const items = PAIRS.map((p, i) => {
        const heroScreen = screenPose(p, p.hero, toHome ? heroRects[i] : heroLocal.rects[i]);
        const logoScreen = { left: q(logoRects[i].left), top: q(logoRects[i].top), size: nativeSize(p, p.logo) };
        return {
          p,
          from: toHome ? heroScreen : logoScreen,
          to:   toHome ? logoScreen : heroScreen,
          exactLocal: heroLocal.local[i],
          alphaFrom: toHome ? HERO_OP : 1,
          alphaTo:   toHome ? 1 : HERO_OP,
          a: makeClone(p, toHome ? p.hero : p.logo, toHome),
          b: makeClone(p, toHome ? p.logo : p.hero, !toHome)
        };
      });

      function render(lin) {
        const e = EASE(lin);
        const second = lin >= .5;
        const hc = heroContent.getBoundingClientRect();
        const hs = hc.height / layoutH(heroContent);
        items.forEach(it => {
          const c = second ? it.b : it.a;
          const other = second ? it.a : it.b;
          const inHero = c.style.position === 'absolute';
          const alpha = lerp(it.alphaFrom, it.alphaTo, e);
          if (inHero && ((toHome && lin === 0) || (!toHome && lin === 1))) {
            place(it.p, c, it.exactLocal.left, it.exactLocal.top, it.exactLocal.size, alpha);
          } else {
            const x = lerp(it.from.left, it.to.left, e);
            const y = lerp(it.from.top, it.to.top, e);
            const z = lerp(it.from.size, it.to.size, e);
            if (inHero) place(it.p, c, q((x - hc.left) / hs), q((y - hc.top) / hs), z / hs, alpha);
            else place(it.p, c, q(x), q(y), z, alpha);
          }
          c.style.visibility = 'visible';
          other.style.visibility = 'hidden';
        });
      }

      PAIRS.forEach(p => { p.logo.style.opacity = '0'; });
      lockup.style.opacity = '0';
      flight = { items, raf: 0 };

      const t0 = performance.now();
      const tick = now => {
        const lin = Math.min(1, Math.max(0, (now - t0) / MORPH_MS));
        render(lin);
        flight.raf = requestAnimationFrame(lin < 1 ? tick : endFlight);
      };
      return { start: () => { render(0); flight.raf = requestAnimationFrame(tick); } };
    }

    function setState(next) {
      const now = Date.now();
      if (next === state || now < lockedUntil) return;
      lockedUntil = now + LOCK_MS;
      const flightPlan = reduceMotion ? null : morph(next);
      state = next;
      applyClasses(next);
      if (flightPlan) flightPlan.start();
      if (next === 'intro') {
        nav.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      }
    }

    window.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) < 6) return;
      setState(e.deltaY > 0 ? 'home' : 'intro');
    }, { passive: true });

    let touchY = null;
    window.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', e => {
      if (touchY === null || nav.classList.contains('open')) return;
      const dy = touchY - e.changedTouches[0].clientY;
      touchY = null;
      if (Math.abs(dy) < 45) return;
      setState(dy > 0 ? 'home' : 'intro');
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (['ArrowDown', 'PageDown', ' ', 'Spacebar'].includes(e.key)) {
        if (state === 'intro') { e.preventDefault(); setState('home'); }
      } else if (['ArrowUp', 'PageUp', 'Home'].includes(e.key)) {
        if (state === 'home') { e.preventDefault(); setState('intro'); }
      }
    });

    document.querySelector('.scroll-cue').addEventListener('click', () => setState('home'));
    document.querySelector('.logo').addEventListener('click', e => { e.preventDefault(); setState('intro'); });

    document.addEventListener('focusin', e => {
      if (state === 'intro' && e.target.closest('.nav, .lead, .btn-start, .pillars')) setState('home');
    });
</script>

</body>
</html>
