    :root {
      --white: #f4f2ee;
      --white-soft: rgba(244, 242, 238, 0.86);
      --black: #050505;
      --line: rgba(244, 242, 238, 0.82);
      --gutter: clamp(20px, 5vw, 76px);
      --tagline-size: clamp(21px, 3vw, 44px);

      --title-size: calc(var(--tagline-size) * 2.25);
      --lockup-w: calc(var(--title-size) * 4.52);
      --intro-scale: 1.45;
      --ease: cubic-bezier(.77, 0, .18, 1);
      --ease-out: cubic-bezier(.2, .7, .2, 1);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; overscroll-behavior: none; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
    }

    .hero__bg {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: url('assets/kaizen-bg.jpg') no-repeat;

      background-size: auto 118%;
      background-position: 77% 46%;
      transform-origin: 60% 30%;
      animation: bgIn 2.4s var(--ease-out) both;
      transition: transform 1.8s var(--ease);
    }

    @media (min-aspect-ratio: 21/10) {
      .hero__bg { background-size: cover; background-position: 85% 30%; }
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background:

        radial-gradient(ellipse 22% 42% at 88% 50%, rgba(0,0,0,.62) 0%, rgba(0,0,0,.38) 45%, rgba(0,0,0,0) 100%),
        linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 28%, rgba(0,0,0,.08) 55%, rgba(0,0,0,0) 70%),
        linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 78%, rgba(0,0,0,.45) 100%);
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse 80% 90% at 70% 40%, rgba(0,0,0,0) 30%, rgba(0,0,0,.45) 100%);
      opacity: 0;
      transition: opacity 1.4s ease;
      pointer-events: none;
    }

    .nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(18px, 3.4vh, 34px) var(--gutter) 0;
      z-index: 10;
      transition: opacity .9s ease, transform 1.1s var(--ease);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: clamp(8px, 0.75vw, 12px);
      line-height: 1;
      font-family: 'Jost', sans-serif;
      text-transform: uppercase;
    }
    .logo__mark {
      display: block;
      height: clamp(40px, 4.1vw, 60px);
      width: auto;
      margin: -4px 0 -4px -6px;
      filter: drop-shadow(0 1px 6px rgba(0,0,0,.45));
    }
    .logo__kanji {
      display: flex;
      flex-direction: column;
      font-family: 'Noto Serif JP', serif;
      font-weight: 400;
      font-size: clamp(15px, 1.45vw, 21px);
      line-height: 1.12;
      text-transform: none;
    }
    .logo__text {
      display: flex;
      flex-direction: column;
    }
    .logo__main {
      font-weight: 500;
      font-size: clamp(16px, 1.75vw, 26px);
      letter-spacing: 0.24em;
    }
    .logo__sub {
      font-weight: 400;
      font-size: clamp(9px, 0.98vw, 14.5px);
      letter-spacing: 0.43em;
      margin-top: 0.42em;
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.6vw, 40px);
      list-style: none;
      font-size: clamp(11px, 0.98vw, 15px);
      font-weight: 500;
    }
    .nav__links a:not(.btn-reserve) {
      position: relative;
      opacity: .95;
      transition: opacity .25s;
    }
    .nav__links a:not(.btn-reserve)::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: -6px;
      height: 1px;
      background: var(--white);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s ease;
    }
    .nav__links a:not(.btn-reserve):hover::after { transform: scaleX(1); }

    .btn-reserve {
      display: inline-block;
      background: var(--white);
      color: #111;
      padding: 0.78em 1.05em;
      border-radius: 4px;
      font-weight: 500;
      margin-left: clamp(0px, 0.4vw, 8px);
      transition: background .25s, transform .25s;
    }
    .btn-reserve:hover { background: #fff; transform: translateY(-1px); }

    .lang-switch {
      display: flex;
      align-items: center;
      gap: 0.45em;
      font-family: 'Jost', sans-serif;
      font-size: 0.92em;
      letter-spacing: 0.14em;
    }
    .lang-switch button {
      background: none;
      border: 0;
      padding: 0.3em 0.1em;
      color: var(--white);
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      opacity: .45;
      border-bottom: 1px solid transparent;
      transition: opacity .25s, border-color .25s;
    }
    .lang-switch button:hover { opacity: .85; }
    .lang-switch button.is-active { opacity: 1; border-bottom-color: var(--white); }
    .lang-switch button:focus-visible { outline: 1px solid var(--white); outline-offset: 3px; }
    .lang-sep { opacity: .35; }

    .burger { display: none; background: none; border: 0; cursor: pointer; width: 30px; height: 20px; position: relative; }
    .burger span { position: absolute; left: 0; right: 0; height: 1.5px; background: var(--white); transition: .3s; }
    .burger span:nth-child(1) { top: 2px; }
    .burger span:nth-child(2) { top: 9px; }
    .burger span:nth-child(3) { top: 16px; }

    .hero__content {
      position: absolute;
      left: var(--gutter);
      top: 25.5%;
      max-width: 560px;
      transform-origin: 0 0;
      transition: transform 1.15s var(--ease);
    }

    .kanji {
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
      font-size: clamp(17px, 2.1vw, 32px);
      line-height: 1.16;
      display: flex;
      align-items: center;
      gap: 0.32em;
      margin-bottom: clamp(10px, 1.8vh, 20px);
      opacity: .78;
      animation: fadeUpSoft 1.2s .35s var(--ease-out) both;
    }
    .kanji__chars { display: flex; flex-direction: column; }

    .kanji__mark {
      display: block;
      height: 2.55em;
      width: auto;
      margin: -0.12em 0 -0.12em -0.06em;
    }

    .title {
      font-family: 'Oswald', 'Jost', sans-serif;
      font-weight: 400;
      font-size: var(--title-size);
      letter-spacing: 0.40em;
      line-height: 1;
      margin-right: -0.40em;
      margin-left: -0.055em;
      text-transform: uppercase;
      white-space: nowrap;
      animation: fadeUp 1.2s .5s var(--ease-out) both;
    }
    .title__text, .tagline__text { display: inline-block; }

    .title-rule {
      display: block;
      width: clamp(26px, 2.9vw, 42px);
      height: 2px;
      background: var(--white);
      margin: clamp(14px, 2.6vh, 26px) 0 clamp(6px, 1.2vh, 12px);
      transform-origin: left;
      animation: grow .9s .95s var(--ease-out) both;
    }

    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 500;
      font-size: var(--tagline-size);
      letter-spacing: 0.06em;
      line-height: 1.2;
      white-space: nowrap;
      animation: fadeUp 1.2s .75s var(--ease-out) both;
    }

    .lead {
      margin-top: clamp(12px, 2.4vh, 24px);
      font-size: clamp(12px, 1.12vw, 16.5px);
      line-height: 1.45;
      color: var(--white-soft);
      max-width: 23em;
      transition: opacity .8s ease, transform 1s var(--ease);
    }

    .btn-start {
      margin-top: clamp(22px, 5vh, 46px);
      display: inline-flex;
      align-items: center;
      gap: 0.95em;
      border: 1.5px solid var(--line);
      padding: 0.72em 1.15em 0.72em 1.1em;
      font-size: clamp(13px, 1.22vw, 18px);
      font-weight: 500;
      border-radius: 1px;
      transition: opacity .8s ease, transform 1s var(--ease), background .3s, color .3s;
    }
    .btn-start svg { width: 1.45em; height: auto; transition: transform .3s ease; }
    .btn-start:hover { background: var(--white); color: #111; }
    .btn-start:hover svg { transform: translateX(4px); }

    .pillars {
      position: absolute;
      right: var(--gutter);
      top: 27%;
      height: 46%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding-left: clamp(18px, 3.2vw, 42px);
      transition: opacity .9s ease;
    }

    .pillars::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 1.5px;
      background: var(--line);
      transform-origin: top;
      transition: transform 1.1s var(--ease);
    }
    .pillars::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 12px;
      border-top: 1.5px solid var(--line);
      border-bottom: 1.5px solid var(--line);
    }
    .pillars li {
      list-style: none;
      font-family: 'Jost', sans-serif;
      font-weight: 500;
      font-size: clamp(10px, 1.03vw, 15px);
      letter-spacing: 0.24em;
      text-transform: uppercase;
      white-space: nowrap;
      color: #fff;
      text-shadow: 0 0 2px rgba(0,0,0,.55), 0 1px 10px rgba(0,0,0,.75), 0 0 24px rgba(0,0,0,.6);
      margin-right: -0.24em;
      cursor: default;
      transition: transform .35s ease, opacity .35s;
    }
    .pillars::before, .pillars::after { filter: drop-shadow(0 0 6px rgba(0,0,0,.7)); }
    .pillars:hover li { opacity: .5; }
    .pillars li:hover { opacity: 1; transform: translateX(-4px); }

    .scroll-cue {
      position: absolute;

      left: calc(var(--gutter) + var(--lockup-w) * var(--intro-scale) / 2);
      bottom: clamp(22px, 3.2vh, 36px);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(12px, 1.6vh, 16px);
      padding: 8px 14px 0;
      background: none;
      border: 0;
      color: var(--white);
      cursor: pointer;
      z-index: 5;
      transition: opacity .6s ease, transform .9s var(--ease);
      animation: fadeIn 1.4s 1.5s ease backwards;
    }

    .scroll-cue__label {
      font-family: 'Jost', sans-serif;
      font-weight: 400;
      font-size: clamp(9px, 0.62vw, 11.5px);
      letter-spacing: 0.46em;
      margin-right: -0.46em;
      text-transform: uppercase;
      opacity: .6;
      animation: cueBreath 2.8s ease-in-out infinite;
    }

    .scroll-cue__line {
      position: relative;
      display: block;
      width: 1px;
      height: clamp(46px, 7vh, 72px);
      background: rgba(244, 242, 238, .12);
      overflow: hidden;
    }
    .scroll-cue__line::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(244,242,238,.15), var(--white));
      transform-origin: top;
      animation: cueLine 2.8s var(--ease) infinite;
    }
    .scroll-cue:hover .scroll-cue__label { opacity: 1; animation-play-state: paused; }
    .scroll-cue:hover .scroll-cue__line::after { animation-duration: 1.6s; }
    .scroll-cue:focus-visible { outline: 1px solid rgba(244,242,238,.5); outline-offset: 6px; }

    .is-intro .hero__bg { transform: scale(1.05); }
    .is-intro .hero::after { opacity: 1; }
    .is-intro .hero__content { transform: scale(var(--intro-scale)); }

    .is-intro .nav,
    .is-intro .lead,
    .is-intro .btn-start,
    .is-intro .pillars {
      opacity: 0;
      pointer-events: none;
      transition-duration: .4s;
      transition-delay: 0s;
    }
    .is-intro .nav       { transform: translateY(-14px); }
    .is-intro .lead      { transform: translateY(16px); }
    .is-intro .btn-start { transform: translateY(16px); }
    .is-intro .pillars::before { transform: scaleY(0); transition-duration: .4s; }

    .is-home .nav       { transition-delay: .3s, .3s; }
    .is-home .lead      { transition-delay: .5s, .5s; }
    .is-home .btn-start { transition-delay: .62s, .62s, 0s, 0s; }
    .is-home .pillars   { transition-delay: .45s; }
    .is-home .pillars::before { transition-delay: .55s; }
    .is-home .pillars li { animation: fadeLeft .9s var(--ease-out) backwards; }
    .is-home .pillars li:nth-child(1) { animation-delay: .70s; }
    .is-home .pillars li:nth-child(2) { animation-delay: .80s; }
    .is-home .pillars li:nth-child(3) { animation-delay: .90s; }
    .is-home .pillars li:nth-child(4) { animation-delay: 1.0s; }

    .is-home .scroll-cue {
      opacity: 0;
      transform: translate(-50%, 18px);
      pointer-events: none;
      transition-duration: .45s;
    }

    @keyframes bgIn     { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUpSoft { from { opacity: 0; transform: translateY(18px); } to { opacity: .78; transform: none; } }
    @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeLeft { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    @keyframes grow     { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes cueLine  {
      0%        { transform: scaleY(0); transform-origin: top; }
      45%       { transform: scaleY(1); transform-origin: top; }
      45.01%    { transform: scaleY(1); transform-origin: bottom; }
      90%, 100% { transform: scaleY(0); transform-origin: bottom; }
    }
    @keyframes cueBreath { 0%, 100% { opacity: .45; } 45% { opacity: .85; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media (max-width: 860px) {
      .nav__links li:not(:last-child):not(.lang-item) { display: none; }
    }

    @media (max-width: 1100px) {
      :root { --intro-scale: 1.28; }
    }

    @media (max-width: 640px) {
      :root { --intro-scale: 1.08; }
      .hero__bg { background-size: cover; background-position: 60% 0%; }
      .hero::before {
        background:
          linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 30%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.85) 100%);
      }
      .nav__links {
        position: fixed; inset: 0; z-index: -1;
        flex-direction: column; justify-content: center; gap: 28px;
        background: rgba(5,5,5,.94); font-size: 20px;
        opacity: 0; pointer-events: none; transition: opacity .35s;
      }
      .nav__links li:not(:last-child):not(.lang-item) { display: block; }
      .lang-switch { font-size: 18px; margin-top: 6px; }
      .nav.open .nav__links { opacity: 1; pointer-events: auto; }
      .nav.open .burger span:nth-child(1) { top: 9px; transform: rotate(45deg); }
      .nav.open .burger span:nth-child(2) { opacity: 0; }
      .nav.open .burger span:nth-child(3) { top: 9px; transform: rotate(-45deg); }
      .burger { display: block; }
      .hero__content { top: auto; bottom: 8%; right: var(--gutter); transform-origin: 0 100%; }
      .pillars {
        top: 16%; height: auto;
        gap: 18px; padding-left: 16px;
      }
      .pillars::after { left: 0; width: 8px; }
    }
</style>
</head>

  <main class="hero">
    <div class="hero__bg" role="img" data-i18n-aria="bgAlt" aria-label="Atleta de espaldas, sudoroso, en blanco y negro"></div>

    <header class="nav">
      <a href="#" class="logo" data-i18n-aria="logoAlt" aria-label="Kaizen Fitness — Inicio">
        <span class="logo__kanji" lang="ja" aria-hidden="true"><span>改</span><span>善</span></span>
        <img src="assets/img/logo.png" alt="" class="logo__mark" aria-hidden="true">
        <span class="logo__text">
          <span class="logo__main">Kaizen</span>
          <span class="logo__sub">Fitness</span>
        </span>
      </a>

      <nav>
        <ul class="nav__links">
          <li><a href="#" data-i18n="navHome">Inicio</a></li>
          <li><a href="#servicios" data-i18n="navServices">Servicios</a></li>
          <li><a href="#planes" data-i18n="navPlans">Planes</a></li>
          <li><a href="#sobre-mi" data-i18n="navAbout">Sobre mí</a></li>
          <li class="lang-item">
            <div class="lang-switch" role="group" aria-label="Idioma / Language">
              <button type="button" data-lang="es" lang="es">ES</button><span class="lang-sep" aria-hidden="true">/</span><button type="button" data-lang="en" lang="en">EN</button>
            </div>
          </li>
          <li><a href="#reservar" class="btn-reserve" data-i18n="navBook">Reservar sesión</a></li>
        </ul>
      </nav>

      <button class="burger" aria-expanded="false" aria-label="Abrir menú"><span></span><span></span><span></span></button>
    </header>

    <section class="hero__content">
      <div class="kanji" lang="ja" aria-hidden="true">
        <span class="kanji__chars"><span>改</span><span>善</span></span>
        <img src="assets/img/logo.png" alt="" class="kanji__mark">
      </div>
      <h1 class="title"><span class="title__text">Kaizen</span></h1>
      <span class="title-rule"></span>
      <p class="tagline"><span class="tagline__text" data-i18n="tagline">Potencia tu performance.</span></p>
      <p class="lead" data-i18n="lead">Entrenamiento personal y asesoramiento para una mejor versión de ti.</p>
      <a href="#servicios" class="btn-start">
        <span data-i18n="cta">Empezar</span>
        <svg viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M1 6h23M19 1l5 5-5 5"/>
        </svg>
      </a>
    </section>

    <ul class="pillars" data-i18n-aria="pillarsAlt" aria-label="Pilares">
      <li data-i18n="p1">Fuerza</li>
      <li data-i18n="p2">Movilidad</li>
      <li data-i18n="p3">Rendimiento</li>
      <li data-i18n="p4">Salud</li>
    </ul>

    <button type="button" class="scroll-cue" data-i18n-aria="scrollAlt" aria-label="Descubrir la página">
      <span class="scroll-cue__label" data-i18n="scroll">Empezar</span>
      <span class="scroll-cue__line" aria-hidden="true"></span>
    </button>
  </main>

  <script>    const I18N = {
      es: {
        title: 'Kaizen Fitness — Potencia tu performance',
        description: 'Entrenamiento personal y asesoramiento para una mejor versión de ti.',
        bgAlt: 'Atleta de espaldas, sudoroso, en blanco y negro',
        logoAlt: 'Kaizen Fitness — Inicio',
        navHome: 'Inicio', navServices: 'Servicios', navPlans: 'Planes', navAbout: 'Sobre mí',
        navBook: 'Reservar sesión',
        tagline: 'Potencia tu performance.',
        lead: 'Entrenamiento personal y asesoramiento para una mejor versión de ti.',
        cta: 'Empezar',
        pillarsAlt: 'Pilares',
        p1: 'Fuerza', p2: 'Movilidad', p3: 'Rendimiento', p4: 'Salud',
        scroll: 'Empezar', scrollAlt: 'Descubrir la página',
        menuOpen: 'Abrir menú', menuClose: 'Cerrar menú'
      },

      en: {
        title: 'Kaizen Fitness — Boost your performance',
        description: 'Personal training and coaching to help you become the best version of yourself.',
        bgAlt: 'Athlete seen from behind, sweating, in black and white',
        logoAlt: 'Kaizen Fitness — Home',
        navHome: 'Home', navServices: 'Services', navPlans: 'Plans', navAbout: 'About me',
        navBook: 'Book a session',
        tagline: 'Boost your performance.',
        lead: 'Personal training and coaching to help you become the best version of yourself.',
        cta: 'Get started',
        pillarsAlt: 'Pillars',
        p1: 'Strength', p2: 'Mobility', p3: 'Performance', p4: 'Health',
        scroll: 'Start', scrollAlt: 'Explore the page',
        menuOpen: 'Open menu', menuClose: 'Close menu'
      }
    };

    const LOCALE = { es: 'es-ES', en: 'en-GB' };
    const STORE_KEY = 'kaizen-lang';

    function storedLang() {
      try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
    }
    function saveLang(l) {
      try { localStorage.setItem(STORE_KEY, l); } catch (e) {}
    }
    function browserLang() {
      const prefs = (navigator.languages && navigator.languages.length)
        ? navigator.languages : [navigator.language || 'en'];
      for (const l of prefs) {
        const code = String(l).toLowerCase().slice(0, 2);
        if (code === 'es' || code === 'en') return code;
      }
      return 'en';
    }
    function initialLang() {
      const forced = new URLSearchParams(location.search).get('lang');
      if (I18N[forced]) return forced;
      const saved = storedLang();
      if (I18N[saved]) return saved;
      return browserLang();
    }

    const root = document.documentElement;
    const nav = document.querySelector('.nav');
    const burger = document.querySelector('.burger');
    let T;

    function applyLang(lang) {
      T = I18N[lang];
      root.lang = LOCALE[lang];
      document.title = T.title;
      document.querySelector('meta[name="description"]').setAttribute('content', T.description);
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', T[el.dataset.i18nAria]); });
      document.querySelectorAll('.lang-switch button').forEach(b => {
        const on = b.dataset.lang === lang;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-pressed', on);
      });
      burger.setAttribute('aria-label', nav.classList.contains('open') ? T.menuClose : T.menuOpen);
    }

    const titleText = document.querySelector('.title__text');
    const taglineText = document.querySelector('.tagline__text');
    const TITLE_TRACK = 0.40;
    const TITLE_BEARING = 0.055;
    const TAG_TRACK = -0.01;

    function fitTitle() {
      const tagSize = parseFloat(getComputedStyle(taglineText).fontSize);
      const target = taglineText.offsetWidth - TAG_TRACK * tagSize;
      const curSize = parseFloat(getComputedStyle(titleText).fontSize);
      const inkEm = titleText.offsetWidth / curSize - TITLE_TRACK - TITLE_BEARING;
      if (!target || !inkEm) return;
      root.style.setProperty('--title-size', (target / inkEm).toFixed(2) + 'px');
      root.style.setProperty('--lockup-w', target.toFixed(2) + 'px');
    }

    applyLang(initialLang());
    fitTitle();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
    let fitRaf;
    window.addEventListener('resize', () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitTitle); });

    document.querySelectorAll('.lang-switch button').forEach(b =>
      b.addEventListener('click', () => {
        saveLang(b.dataset.lang);
        applyLang(b.dataset.lang);
        fitTitle();
        if (location.search.includes('lang=')) history.replaceState(null, '', location.pathname + location.hash);
      }));

    burger.addEventListener('click', () => {
      const open = nav.classList.toggle('open');
      burger.setAttribute('aria-expanded', open);
      burger.setAttribute('aria-label', open ? T.menuClose : T.menuOpen);
    });
    document.querySelectorAll('.nav__links a').forEach(a =>
      a.addEventListener('click', () => nav.classList.remove('open')));

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const LOCK_MS = reduceMotion ? 250 : 1250;
    let state = root.classList.contains('is-home') ? 'home' : 'intro';
    let lockedUntil = 0;

    function setState(next) {
      const now = Date.now();
      if (next === state || now < lockedUntil) return;
      state = next;
      lockedUntil = now + LOCK_MS;
      root.classList.toggle('is-intro', next === 'intro');
      root.classList.toggle('is-home', next === 'home');
      if (next === 'intro') {
        nav.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      }
    }

    window.addEventListener('wheel', e => {
      if (Math.abs(e.deltaY) < 6) return;
      setState(e.deltaY > 0 ? 'home' : 'intro');
    }, { passive: true });

    let touchY = null;
    window.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', e => {
      if (touchY === null || nav.classList.contains('open')) return;
      const dy = touchY - e.changedTouches[0].clientY;
      touchY = null;
      if (Math.abs(dy) < 45) return;
      setState(dy > 0 ? 'home' : 'intro');
    }, { passive: true });

    window.addEventListener('keydown', e => {
      if (['ArrowDown', 'PageDown', ' ', 'Spacebar'].includes(e.key)) {
        if (state === 'intro') { e.preventDefault(); setState('home'); }
      } else if (['ArrowUp', 'PageUp', 'Home'].includes(e.key)) {
        if (state === 'home') { e.preventDefault(); setState('intro'); }
      }
    });

    document.querySelector('.scroll-cue').addEventListener('click', () => setState('home'));
    document.querySelector('.logo').addEventListener('click', e => { e.preventDefault(); setState('intro'); });

    document.addEventListener('focusin', e => {
      if (state === 'intro' && e.target.closest('.nav, .lead, .btn-start, .pillars')) setState('home');
    });
</script>

</body>
</html>
